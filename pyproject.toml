[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "revdpd"
version = "0.1.0"
description = "Interactive GUI to back-map DPD coarse-grained LAMMPS systems to all-atom resolution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.23", "scipy>=1.9", "PySide6>=6.5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Environment :: X11 Applications :: Qt",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
revdpd = "revdpd.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]
